<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV - Maxime</title>
    <link rel="stylesheet" type="text/css" href="./asset/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        .cv-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .pdf-viewer {
            width: 100%;
            height: 90vh;
            border: none;
        }
        .back-button {
            margin: 20px;
            padding: 10px 20px;
            background-color: #00abf0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .back-button:hover {
            background-color: #0097d4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <a href="index.html" class="back-button">Retour au Portfolio</a>
        <embed src="./asset/MaximeConstantPortfolio.pdf" type="application/pdf" class="pdf-viewer">
    </div>
</body>
</html>
